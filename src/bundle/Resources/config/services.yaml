services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $aiLogger: '@logger'

    Masilia\IbexaAiEditor\Ibexa\:
        resource: '../../../lib/Ibexa/'
        exclude: '../../../lib/Ibexa/ContentContext.php'

    Masilia\IbexaAiEditor\Llm\:
        resource: '../../../lib/Llm/'
        exclude: '../../../lib/Llm/NeuronTextGenerator.php'

    Masilia\Bundle\IbexaAiEditor\Controller\:
        resource: '../../Controller/'
        public: true
        tags: ['controller.service_arguments']
